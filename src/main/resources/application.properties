spring.application.name=lebvest

# Database
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT
jwt.access-secret=${JWT_ACCESS_SECRET}
jwt.refresh-secret=${JWT_REFRESH_SECRET}

# Mail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST}
spring.rabbitmq.port=${RABBITMQ_PORT}
spring.rabbitmq.username=${RABBITMQ_USERNAME}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}

# AWS
aws.credentials.accessKey=${AWS_ACCESS_KEY}
aws.credentials.secretKey=${AWS_SECRET_KEY}
aws.s3.bucket=${AWS_S3_BUCKET}

# App
admin.email=${ADMIN_EMAIL}
frontend.url=${FRONTEND_URL}
url.pending-prefix=${PENDING_PREFIX}
url.accepted-prefix=${ACCEPTED_PREFIX}

# Queues
queue.company.signup.upload=${QUEUE_SIGNUP_UPLOAD}
queue.company.signup.email=${QUEUE_SIGNUP_EMAIL}
queue.company.signup.accepted.move=${QUEUE_SIGNUP_ACCEPTED_MOVE}

# Multipart
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Debug
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG
