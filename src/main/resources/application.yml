spring:
  application:
    name: lebvest

  # Database Configuration (MySQL)
  datasource:
    url: jdbc:mysql://localhost:3306/lebvest?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  # Flyway Configuration
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  # Mail Configuration
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:your-email@gmail.com}
    password: ${MAIL_PASSWORD:your-app-password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  # RabbitMQ Configuration
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        retry:
          enabled: true
          initial-interval: 1000
          max-attempts: 3
          multiplier: 2

  # Security Configuration
  security:
    user:
      name: admin
      password: admin

# Server Configuration
server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
    include-stacktrace: on_param
    include-binding-errors: always

# JWT Configuration
jwt:
  access-secret: ${JWT_ACCESS_SECRET:your-very-long-and-secure-access-secret-key-minimum-256-bits-for-hmac-sha256-algorithm}
  refresh-secret: ${JWT_REFRESH_SECRET:your-very-long-and-secure-refresh-secret-key-minimum-256-bits-for-hmac-sha256-algorithm}

# AWS S3 Configuration
aws:
  credentials:
    accessKey: ${AWS_ACCESS_KEY:your-aws-access-key}
    secretKey: ${AWS_SECRET_KEY:your-aws-secret-key}
  s3:
    bucket: ${AWS_S3_BUCKET:lebvest-bucket}
  region: us-east-1

# Application Custom Configuration
admin:
  email: ${ADMIN_EMAIL:admin@lebvest.com}

frontend:
  url: ${FRONTEND_URL:http://localhost:3000}

url:
  pending-prefix: ${PENDING_PREFIX:pending/}
  accepted-prefix: ${ACCEPTED_PREFIX:accepted/}

queue:
  company:
    signup:
      upload: ${QUEUE_SIGNUP_UPLOAD:company.signup.upload}
      email: ${QUEUE_SIGNUP_EMAIL:company.signup.email}
      accepted:
        move: ${QUEUE_SIGNUP_ACCEPTED_MOVE:company.signup.accepted.move}

# Logging Configuration
logging:
  level:
    root: INFO
    com.lebvest: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

