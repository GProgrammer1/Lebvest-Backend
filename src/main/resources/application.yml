spring:
  application:
    name: lebvest

  datasource:
    url: jdbc:mysql://${DB_HOST:lebvest.cc5w6c8uk08j.us-east-1.rds.amazonaws.com}:${DB_PORT:3306}/${DB_NAME:lebvest}?createDatabaseIfNotExist=${CREATE_DB_IF_NOT_EXIST:false}&useSSL=${DB_USE_SSL:true}&requireSSL=${DB_REQUIRE_SSL:false}&serverTimezone=UTC&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=utf8&connectionTimeout=30000&socketTimeout=60000
    username: ${DB_USERNAME:admin}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: ${DB_MIN_IDLE:5}
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      leak-detection-threshold: 60000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  # Multipart Configuration
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

  # Flyway Configuration
  flyway:
    enabled: false # Disabled - using Hibernate ddl-auto: none instead
    baseline-on-migrate: true
    locations: classpath:db/migration
  # Mail Configuration (Production - SMTP)
  # Override in application-dev.yml for dev profile (GreenMail)
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:your-email@gmail.com}
    password: ${MAIL_PASSWORD:your-app-password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        retry:
          enabled: true
          initial-interval: 1000
          max-attempts: 3
          multiplier: 2


  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    timeout: 2000ms
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 0

  # Security Configuration
  security:
    user:
      name: admin
      password: admin

# Server Configuration
server:
  port: ${PORT:${SERVER_PORT:8080}}
  address: 0.0.0.0  # Bind to all interfaces (IPv4 and IPv6)
  error:
    include-message: always
    include-stacktrace: on_param
    include-binding-errors: always

# JWT Configuration
jwt:
  access-secret: ${JWT_ACCESS_SECRET:your-very-long-and-secure-access-secret-key-minimum-256-bits-for-hmac-sha256-algorithm}
  refresh-secret: ${JWT_REFRESH_SECRET:your-very-long-and-secure-refresh-secret-key-minimum-256-bits-for-hmac-sha256-algorithm}

# AWS S3 Configuration
aws:
  credentials:
    accessKey: ${AWS_ACCESS_KEY:your-aws-access-key}
    secretKey: ${AWS_SECRET_KEY:your-aws-secret-key}
  s3:
    bucket: ${AWS_S3_BUCKET:lebvest-bucket}
  region: us-east-1

admin:
  email: ${ADMIN_EMAIL:bousleimengeorgio139@gmail.com}


frontend:
  url: ${FRONTEND_URL:https://lebvest.com}

file:
  upload:

    base-dir: ${UPLOADS_BASE_DIR:}

stripe:
  secret-key: ${STRIPE_SECRET_KEY:sk_test_...}
  publishable-key: ${STRIPE_PUBLISHABLE_KEY:pk_test_...}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET:whsec_...}

url:
  pending-prefix: ${PENDING_PREFIX:pending/}
  accepted-prefix: ${ACCEPTED_PREFIX:accepted/}

queue:
  company:
    signup:
      upload: ${QUEUE_SIGNUP_UPLOAD:company.signup.upload}
      email: ${QUEUE_SIGNUP_EMAIL:company.signup.email}
      accepted:
        move: ${QUEUE_SIGNUP_ACCEPTED_MOVE:company.signup.accepted.move}

# Logging Configuration
# Override in application-dev.yml for more verbose dev logging
logging:
  level:
    root: INFO
    com.lebvest: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: INFO
    org.hibernate.type.descriptor.sql.BasicBinder: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
