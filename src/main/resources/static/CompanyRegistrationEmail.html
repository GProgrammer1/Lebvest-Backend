<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <title>New Company Registration</title>
</head>
<body style="margin:0;padding:0;background-color:#f5f7fa;font-family:Inter,Segoe UI,Roboto,Helvetica,Arial,sans-serif;">
<table width="100%" cellpadding="0" cellspacing="0" role="presentation">
    <tr>
        <td align="center" style="padding: 40px 20px;">
            <table width="600" cellpadding="0" cellspacing="0"
                   style="background:white;border-radius:8px;padding:40px;box-shadow:0 4px 14px rgba(0,0,0,0.05);">

                <!-- Header -->
                <tr>
                    <td style="text-align: center; padding-bottom: 24px;">
                        <h1 style="margin:0;color:#0A3161;font-size:24px;">New Company Registration</h1>
                        <p style="color:#6b7280;font-size:14px;margin-top:8px;">LebVest Admin Notification</p>
                    </td>
                </tr>

                <!-- Details -->
                <tr>
                    <td style="padding: 24px 0; font-size: 16px; color: #1f2937; line-height: 1.6;">
                        <p><strong style="color:#0A3161;">Name:</strong> {{name}}</p>
                        <p><strong style="color:#0A3161;">Email:</strong> {{email}}</p>
                        <p><strong style="color:#0A3161;">Company Name:</strong> {{companyName}}</p>
                        <p><strong style="color:#0A3161;">Description:</strong><br/>{{description}}</p>
                        <p><strong style="color:#0A3161;">Sector:</strong> {{sector}}</p>
                    </td>
                </tr>


                <!-- Footer -->
                <tr>
                    <td style="border-top: 1px solid #e5e7eb; padding-top: 20px; text-align: center;">
                        <p style="color:#9ca3af;font-size:13px;margin:0;">
                            This is an automated message from <strong style="color:#0A3161;">LebVest</strong>.
                        </p>
                    </td>
                </tr>

            </table>
        </td>
    </tr>
</table>
</body>
</html>
